<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12">
<title>VEYRA — Personal Control Center</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#10131d;--panel2:#151a27;--line:#252b3a;--muted:#8b94aa;--text:#edf0fa;--accent:#9b8cff;--accent2:#6ee7d2;--danger:#ff8095;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#27234d 0,transparent 38%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#0b0e16d9;padding:24px 15px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.logo{width:38px;height:38px;border:1px solid #8e82ff;border-radius:12px;display:grid;place-items:center;color:#c4bcff;background:linear-gradient(145deg,#242041,#10131d);box-shadow:0 0 26px #8e82ff24;font-weight:800;font-size:19px}.brand strong{letter-spacing:.18em;font-size:14px}.brand small{display:block;color:var(--muted);letter-spacing:.03em;margin-top:3px;font-size:10px}.workspace{margin:0 5px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:10px;text-align:left}.workspace .orb{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px #6ee7d2}.workspace span:nth-child(2){flex:1}.workspace b{font-size:12px;display:block}.workspace small{color:var(--muted);font-size:10px}.section-label{font-size:10px;color:#737d94;letter-spacing:.15em;font-weight:750;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;border-radius:11px;background:transparent;color:#aab2c6;text-align:left;font-size:13px}.nav button:hover,.nav button.active{background:#1a1d2b;color:#f4f2ff;border-color:#302d4c}.nav button.active .ico{color:var(--accent)}.ico{width:18px;text-align:center;font-size:16px}.nav .shortcut{margin-left:auto;color:#717b91;font-size:10px}.side-bottom{margin-top:auto}.profile{border-top:1px solid var(--line);padding:16px 7px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7769db,#3a9eab);display:grid;place-items:center;font-weight:800;color:white}.profile b{display:block;font-size:12px}.profile small{color:var(--muted);font-size:10px}.main{min-width:0;padding:25px clamp(18px,4vw,48px) 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:35px}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--text);font-weight:600}.top-actions{display:flex;gap:9px;align-items:center}.search-btn,.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 13px;color:#c1c8da}.search-btn{min-width:190px;text-align:left;font-size:12px;display:flex;justify-content:space-between;gap:18px}.search-btn kbd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}.icon-btn{width:39px;height:39px;padding:0}.btn.primary{background:var(--accent);color:#100e20;border-color:var(--accent);font-weight:750}.btn:hover,.icon-btn:hover,.search-btn:hover{filter:brightness(1.12)}.eyebrow{font-size:10px;letter-spacing:.17em;color:var(--accent2);font-weight:800;text-transform:uppercase;margin-bottom:11px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:25px}.page-head h1{font-size:clamp(28px,3vw,39px);letter-spacing:-.045em;margin:0 0 8px;font-weight:690}.page-head p{color:var(--muted);margin:0;font-size:13px;line-height:1.65}.date-pill{border:1px solid var(--line);background:#111521;border-radius:100px;padding:9px 13px;color:#aeb6c9;font-size:11px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#131724f5,#0e111af5);border-radius:var(--radius)}.stat{padding:17px 18px;min-height:118px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;align-items:center}.stat-icon{color:var(--accent);font-size:17px}.stat-value{font-size:29px;letter-spacing:-.05em;font-weight:680;margin:14px 0 5px}.stat-note{font-size:10px;color:#8993a9}.positive{color:var(--accent2)}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.9fr);gap:16px}.panel{padding:20px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-head h2{font-size:14px;margin:0;font-weight:650}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.subtle{color:var(--muted);font-size:11px}.text-link{border:0;background:none;color:var(--accent);font-size:11px}.task-list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #222838;border-radius:12px;background:#111520}.task input{accent-color:var(--accent);width:15px;height:15px}.task-copy{flex:1;min-width:0}.task-copy b{display:block;font-size:12px;font-weight:550;overflow:hidden;text-overflow:ellipsis}.task-copy small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.task.done .task-copy b{text-decoration:line-through;color:#727c91}.tag{font-size:9px;border:1px solid #3d345b;background:#221d35;color:#c0b4ff;padding:4px 7px;border-radius:6px;white-space:nowrap}.tag.teal{border-color:#244b4b;background:#152a2b;color:#7ce4d4}.empty{color:var(--muted);font-size:12px;padding:25px;text-align:center;border:1px dashed var(--line);border-radius:12px}.progress-line{height:5px;background:#252a38;border-radius:20px;overflow:hidden;margin:16px 0 8px}.progress-line span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;transition:width .25s}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{padding:14px;border:1px solid var(--line);border-radius:13px;background:#111520;text-align:left;min-height:91px}.quick:hover{border-color:#5b528a;background:#17192a}.quick .qicon{font-size:17px;color:var(--accent);display:block;margin-bottom:13px}.quick b{display:block;font-size:11px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.activity{display:grid;gap:0}.activity-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #222838}.activity-item:last-child{border-bottom:0}.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 10px #9b8cff45}.activity-item b{font-size:11px;font-weight:550;display:block}.activity-item small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.content-page{max-width:1000px}.content-page .panel{margin-bottom:15px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:11px;color:#b6bfd2}.field input,.field textarea{width:100%;background:#0b0e16;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;outline:none}.field textarea{min-height:210px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus{border-color:var(--accent)}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row b{font-size:12px;display:block}.setting-row small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.switch{width:38px;height:22px;border-radius:20px;border:1px solid var(--line);background:#272d3b;padding:3px;display:flex;align-items:center}.switch:after{content:"";width:14px;height:14px;border-radius:50%;background:#abb3c6;transition:transform .2s}.switch.on{background:#4c4380;border-color:#8f81ff}.switch.on:after{background:#fff;transform:translateX(15px)}.overlay{position:fixed;inset:0;background:#05060bc9;backdrop-filter:blur(8px);z-index:5;display:none;align-items:flex-start;justify-content:center;padding:13vh 20px 20px}.overlay.open{display:flex}.command{width:min(560px,100%);background:#111521;border:1px solid #34394b;border-radius:17px;box-shadow:0 25px 100px #0009;overflow:hidden}.command input{width:100%;padding:19px 20px;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--text)}.command-list{padding:8px;max-height:45vh;overflow:auto}.command-list button{width:100%;padding:12px;border:0;background:transparent;border-radius:9px;text-align:left;color:#c8cfe0;font-size:12px}.command-list button:hover{background:#22263a}.toast{position:fixed;bottom:20px;right:20px;z-index:9;background:#1a2030;border:1px solid #414962;border-radius:12px;padding:13px 16px;font-size:12px;box-shadow:0 10px 40px #0005;display:none}.toast.show{display:block}.footer-note{font-size:10px;color:#68738b;margin-top:25px;text-align:center}.compact .main{padding-top:18px}.compact .panel{padding:15px}.compact .task{padding:8px}.compact .stat{min-height:96px;padding:13px}.compact .dashboard-grid{gap:11px}.task-search{width:100%;max-width:320px;background:#0b0e16;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12px;outline:none}.task-search:focus{border-color:var(--accent)}.task-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.task-tools .subtle{white-space:nowrap}body.light .task-search{background:#f7f8fc}@media(max-width:520px){.task-tools{align-items:stretch;flex-direction:column}.task-search{max-width:none}}
body.light{--bg:#f4f5fb;--panel:#fff;--panel2:#f3f4fa;--line:#dfe2ed;--muted:#707b92;--text:#171a29;background:radial-gradient(ellipse at 80% -10%,#e1dcff 0,transparent 38%),var(--bg);color:var(--text)}body.light .sidebar{background:#f8f9fdf2}body.light .workspace,body.light .stat,body.light .panel{background:#ffffffd9}body.light .task,body.light .quick,body.light .field input,body.light .field textarea{background:#f7f8fc}body.light .search-btn,body.light .icon-btn,body.light .date-pill{background:#fff;color:var(--text)}body.light .nav button.active{background:#eceafa;color:#282343}body.light .nav button{color:#5e667b}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.sidebar{width:215px}.app{grid-template-columns:215px minmax(0,1fr)}}@media(max-width:700px){.app{display:block}.sidebar{position:sticky;top:0;z-index:3;width:100%;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{padding:0 4px}.brand small,.workspace,.side-bottom,.section-label{display:none}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;padding:9px 11px;font-size:11px}.nav button .ico{width:auto}.nav button .shortcut{display:none}.main{padding:20px 15px 30px}.topbar{margin-bottom:25px}.search-btn{min-width:0;padding:10px}.search-btn span:first-child{display:none}.page-head{align-items:flex-start}.date-pill{display:none}.stats{gap:9px}.stat{padding:14px;min-height:105px}.stat-value{font-size:25px}.panel{padding:15px}.top-actions{gap:6px}}@media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.stat-note{font-size:9px}.nav button{gap:7px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo">V</div><div><strong>VEYRA</strong><small>PERSONAL CONTROL CENTER</small></div></div>
<button class="workspace" data-page="overview"><span class="orb"></span><span><b>Personal workspace</b><small>Local environment</small></span><span>⌄</span></button>
<div><div class="section-label">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="overview"><span class="ico">◫</span>Overview</button>
<button data-page="tasks"><span class="ico">☷</span>Tasks</button>
<button data-page="notes"><span class="ico">▤</span>Scratchpad</button>
<button data-page="activity"><span class="ico">◷</span>Activity</button>
</nav></div>
<div><div class="section-label">PREFERENCES</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav></div>
<div class="side-bottom"><div class="profile"><div class="avatar">V</div><div><b>Workspace owner</b><small>Personal edition</small></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Workspace <span style="color:#555f75">/</span> <b id="crumb">Overview</b></div><div class="top-actions"><button class="search-btn" id="openCommand"><span>⌕ &nbsp; Search anything...</span><kbd>Ctrl K</kbd></button><span class="date-pill" id="todayPill"></span><button class="icon-btn" id="themeBtn" title="Toggle appearance" aria-label="Toggle appearance">◐</button></div></header>
<section id="page"></section>
<div class="footer-note">VEYRA · Your workspace, thoughtfully organized · Changes are saved in this browser</div>
</main>
</div>
<div class="overlay" id="overlay"><div class="command"><input id="commandInput" placeholder="Search pages and actions…" autocomplete="off"><div class="command-list" id="commandList"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem('veyra-'+k))??f}catch{return f}};
const save=(k,v)=>localStorage.setItem('veyra-'+k,JSON.stringify(v));
let tasks=load('tasks',[{id:1,title:'Make this workspace your own',detail:'Explore preferences and set your theme',tag:'SETUP',done:false},{id:2,title:'Capture your first idea',detail:'Use the scratchpad to keep it close',tag:'FOCUS',done:false},{id:3,title:'Plan one important thing',detail:'Add a task and make progress',tag:'TODAY',done:false}]);
let activity=load('activity',[{title:'VEYRA workspace initialized',detail:'Your local workspace is ready'},{title:'Personal workspace created',detail:'Just now'}]);
let current='overview',settings=load('settings',{light:false,compact:false,showStats:true});
const pageNames={overview:'Overview',tasks:'Tasks',notes:'Scratchpad',activity:'Activity',settings:'Settings'};
function log(title,detail='Just now'){activity.unshift({title,detail});activity=activity.slice(0,25);save('activity',activity)}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function dateString(){return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date())}
function header(eyebrow,title,desc,button=''){return '<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+button+'</div>'}
function taskHTML(t){return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+' aria-label="Complete task"><div class="task-copy"><b>'+esc(t.title)+'</b><small>'+esc(t.detail||'Personal task')+'</small></div><span class="tag '+(t.tag==='DONE'?'teal':'')+'">'+(t.done?'DONE':esc(t.tag||'TASK'))+'</span></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function overview(){let done=tasks.filter(t=>t.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0;return header('YOUR SPACE, IN FOCUS','Good to see you.','A calm place to organize your work, capture ideas, and keep momentum.')+
'<div class="stats"><div class="stat"><div class="stat-top">Open tasks <span class="stat-icon">☷</span></div><div class="stat-value">'+(tasks.length-done)+'</div><div class="stat-note">Things still in motion</div></div><div class="stat"><div class="stat-top">Completed <span class="stat-icon">✓</span></div><div class="stat-value">'+done+'</div><div class="stat-note"><span class="positive">'+percent+'%</span> of your task list</div></div><div class="stat"><div class="stat-top">Workspace health <span class="stat-icon">✳</span></div><div class="stat-value">Ready</div><div class="stat-note">Local features available</div></div><div class="stat"><div class="stat-top">Ideas captured <span class="stat-icon">▤</span></div><div class="stat-value">'+(load('notes','').trim()?1:0)+'</div><div class="stat-note">Scratchpad entries saved</div></div></div>'+
'<div class="dashboard-grid"><div class="panel"><div class="panel-head"><div><h2>Focus list</h2><p>A small next step is still a step.</p></div><button class="text-link" data-goto="tasks">View all →</button></div><div class="task-list">'+(tasks.length?tasks.slice(0,4).map(taskHTML).join(''):'<div class="empty">Nothing on your list yet. Add a task to get started.</div>')+'</div><div class="progress-line"><span style="width:'+percent+'%"></span></div><div class="progress-meta"><span>Overall progress</span><span>'+done+' of '+tasks.length+' complete</span></div></div>'+
'<div class="panel"><div class="panel-head"><div><h2>Quick actions</h2><p>Jump straight into your workflow.</p></div></div><div class="quick-grid"><button class="quick" data-action="add-task"><span class="qicon">＋</span><b>New task</b><small>Capture a next step</small></button><button class="quick" data-goto="notes"><span class="qicon">▤</span><b>Open scratchpad</b><small>Save a thought</small></button><button class="quick" data-goto="settings"><span class="qicon">⚙</span><b>Personalize</b><small>Make it feel like yours</small></button><button class="quick" data-action="command"><span class="qicon">⌘</span><b>Command menu</b><small>Navigate faster</small></button></div></div></div>'+
'<div class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Recent activity</h2><p>Your latest workspace changes.</p></div><button class="text-link" data-goto="activity">View history →</button></div>'+activity.slice(0,3).map(a=>'<div class="activity-item"><span class="activity-dot"></span><div><b>'+esc(a.title)+'</b><small>'+esc(a.detail)+'</small></div></div>').join('')+'</div>'}
function tasksPage(){return header('STAY IN MOTION','Tasks','Keep the next steps visible. Everything here is saved in this browser.','<button class="btn primary" data-action="add-task">＋ New task</button>')+'<div class="panel"><div class="panel-head"><div><h2>Your list</h2><p>'+tasks.filter(t=>!t.done).length+' open · '+tasks.filter(t=>t.done).length+' complete</p></div><button class="text-link" data-action="clear-done">Clear completed</button></div><div class="task-tools"><input class="task-search" id="taskSearch" type="search" placeholder="Search your tasks…" aria-label="Search tasks"><span class="subtle">Filter by title or details</span></div><div class="task-list" id="taskList">'+(tasks.length?tasks.map(taskHTML).join(''):'<div class="empty">Your list is clear. Add a task whenever you’re ready.</div>')+'</div></div><div class="panel"><h2 style="font-size:13px;margin:0 0 8px">Add a task</h2><form id="taskForm"><div class="field"><label for="taskTitle">Task title</label><input id="taskTitle" maxlength="120" required placeholder="What do you want to move forward?"></div><div class="field"><label for="taskDetail">Details (optional)</label><input id="taskDetail" maxlength="180" placeholder="Add context or a small next step"></div><button class="btn primary">Add to list</button></form></div>'}
function notesPage(){return header('THINK ON PAPER','Scratchpad','A private-feeling space for quick notes. Saved locally in this browser.')+'<div class="panel"><div class="panel-head"><div><h2>Untitled note</h2><p id="noteStatus">Changes save automatically as you type.</p></div><span class="tag teal">AUTOSAVE</span></div><div class="field"><textarea id="noteText" placeholder="Start with a thought…&#10;&#10;A plan, a question, a reminder, or an idea worth keeping.">'+esc(load('notes',''))+'</textarea></div><div class="setting-row"><div><b>Local storage</b><small>This note stays in this browser and is not synced to other devices.</small></div><button class="btn" data-action="clear-note">Clear note</button></div></div>'}
function activityPage(){return header('WORKSPACE HISTORY','Activity','A lightweight timeline of changes in your current browser.')+'<div class="panel"><div class="panel-head"><div><h2>Recent events</h2><p>Showing the latest '+activity.length+' events.</p></div><button class="text-link" data-action="clear-activity">Clear history</button></div><div class="activity">'+activity.map(a=>'<div class="activity-item"><span class="activity-dot"></span><div><b>'+esc(a.title)+'</b><small>'+esc(a.detail)+'</small></div></div>').join('')+'</div></div>'}
function settingsPage(){return header('MAKE IT YOURS','Preferences','Tune the workspace to suit how you like to work.')+'<div class="panel"><div class="panel-head"><div><h2>Appearance</h2><p>Comfortable, clear, and distraction-aware.</p></div></div><div class="setting-row"><div><b>Light appearance</b><small>Switch from the default dark workspace.</small></div><button class="switch '+(settings.light?'on':'')+'" data-setting="light" aria-label="Toggle light appearance"></button></div><div class="setting-row"><div><b>Compact layout</b><small>Reduce spacing between interface elements.</small></div><button class="switch '+(settings.compact?'on':'')+'" data-setting="compact" aria-label="Toggle compact layout"></button></div></div><div class="panel"><div class="panel-head"><div><h2>Your data</h2><p>Understand what is saved and manage it.</p></div></div><div class="setting-row"><div><b>Local-first workspace</b><small>Tasks, activity, preferences, and scratchpad are stored in this browser only. There are no accounts or cloud sync in this starter build.</small></div><span class="tag teal">ON DEVICE</span></div><div class="setting-row"><div><b>Export your workspace</b><small>Download your tasks, notes, settings, and activity as a JSON file.</small></div><button class="btn" data-action="export">Export data</button></div><div class="setting-row"><div><b>Reset workspace</b><small>Remove local VEYRA data from this browser.</small></div><button class="btn" data-action="reset" style="color:var(--danger)">Reset</button></div></div>'}
function render(){document.body.classList.toggle('light',!!settings.light);document.body.classList.toggle('compact',!!settings.compact);$('#todayPill').textContent=dateString();$('#crumb').textContent=pageNames[current];$$('#nav button,[data-page="settings"]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));$('#page').innerHTML='<div class="content-page">'+({overview,tasks:tasksPage,notes:notesPage,activity:activityPage,settings:settingsPage}[current]())+'</div>';wire()}
function go(p){current=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function wire(){const taskSearch=$('#taskSearch');if(taskSearch)taskSearch.oninput=()=>{const q=taskSearch.value.trim().toLowerCase();$('#taskList .task').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'flex':'none'});};$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$$('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));$$('[data-task]').forEach(c=>c.onchange=()=>{let t=tasks.find(t=>t.id==c.dataset.task);if(t){t.done=c.checked;save('tasks',tasks);log((t.done?'Completed: ':'Reopened: ')+t.title);render()}});$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$$('[data-setting]').forEach(b=>b.onclick=()=>{let k=b.dataset.setting;settings[k]=!settings[k];save('settings',settings);log('Updated preference: '+k);render()});const form=$('#taskForm');if(form)form.onsubmit=e=>{e.preventDefault();addTask($('#taskTitle').value,$('#taskDetail').value)};const note=$('#noteText');if(note)note.oninput=()=>{save('notes',note.value);$('#noteStatus').textContent='Saved just now';};}
function addTask(title,detail=''){title=title.trim();if(!title)return;tasks.unshift({id:Date.now(),title,detail:detail.trim(),tag:'TASK',done:false});save('tasks',tasks);log('Added task: '+title);go('tasks');toast('Task added to your list.')}
function action(a){if(a==='add-task'){go('tasks');setTimeout(()=>$('#taskTitle')?.focus(),20)}if(a==='command')openPalette();if(a==='clear-done'){tasks=tasks.filter(t=>!t.done);save('tasks',tasks);log('Cleared completed tasks');render();toast('Completed tasks cleared.')}if(a==='clear-note'){if(confirm('Clear the scratchpad note?')){save('notes','');log('Cleared scratchpad');render();toast('Scratchpad cleared.')}}if(a==='clear-activity'){if(confirm('Clear the activity history?')){activity=[];save('activity',activity);render()}}if(a==='export'){let data={tasks,notes:load('notes',''),settings,activity,exportedAt:new Date().toISOString()};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='veyra-workspace-export.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Workspace export downloaded.')}if(a==='reset'&&confirm('Reset all VEYRA data stored in this browser? This cannot be undone.')){['tasks','notes','settings','activity'].forEach(k=>localStorage.removeItem('veyra-'+k));tasks=[];activity=[];settings={light:false,compact:false,showStats:true};log('Workspace reset');go('overview');toast('Workspace reset.');}}
$('#themeBtn').onclick=()=>{settings.light=!settings.light;save('settings',settings);log('Changed appearance');render()};
const commands=[['Overview','overview','◫'],['Tasks','tasks','☷'],['Scratchpad','notes','▤'],['Activity','activity','◷'],['Settings','settings','⚙'],['Create a task','add-task','＋'],['Toggle appearance','theme','◐']];
function openPalette(){$('#overlay').classList.add('open');$('#commandInput').value='';drawCommands('');setTimeout(()=>$('#commandInput').focus(),20)}
function drawCommands(q){let list=commands.filter(c=>c[0].toLowerCase().includes(q.toLowerCase()));$('#commandList').innerHTML=list.map(c=>'<button data-cmd="'+c[1]+'">'+c[2]+' &nbsp; '+c[0]+'</button>').join('')||'<div class="empty">No matching actions.</div>';$$('[data-cmd]').forEach(b=>b.onclick=()=>{let c=b.dataset.cmd;$('#overlay').classList.remove('open');if(c==='theme')$('#themeBtn').click();else if(c==='add-task')action(c);else go(c)})}
$('#openCommand').onclick=openPalette;$('#commandInput').oninput=e=>drawCommands(e.target.value);$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#overlay').classList.remove('open')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')$('#overlay').classList.remove('open')});
render();
</script>
</body></html>
